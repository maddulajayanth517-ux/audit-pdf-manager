# Production stack for a single server (e.g. Oracle Cloud Always Free):
#   app   - the Audit PDF Manager (password-protected)
#   caddy - HTTPS in front of it, with an automatic free certificate
# Started by deploy/setup-server.sh, which also writes deploy/.env (DOMAIN, APP_PASSWORD).
services:
  app:
    build: ..
    image: audit-pdf-manager:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_TEMP_DIR: /tmp/audit_pdf_manager
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      WORKERS_PER_JOB: ${WORKERS_PER_JOB:-0}
      FILE_TTL_MINUTES: ${FILE_TTL_MINUTES:-120}
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
